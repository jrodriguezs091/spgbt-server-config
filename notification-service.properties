# ==========================================================
# CONFIGURACIÓN ESPECÍFICA (notification-service)
# ==========================================================

# 1. IDENTIFICACIÓN Y PUERTO
spring.application.name=notification-service
server.port=8087

# 2. VARIABLE DE JWT
notification.jwt.secret=${JWT_SECRET:26f4dd71e8264f1aa8414884cc9d90ad}
notification.jwt.access-expiration=${AUTH_JWT_ACCESS_EXPIRATION}
notification.jwt.refresh-expiration=${AUTH_JWT_REFRESH_EXPIRATION}
notification.api.key=${API_KEY:123456789-MI-CLAVE}

# 3. VARIABLE PATH
server.servlet.context-path=/notification

# Ver el detalle de la negociación de Hikari (el pool de conexiones)
# logging.level.com.zaxxer.hikari=DEBUG
# Ver el detalle de los errores de SQL Server
# logging.level.com.microsoft.sqlserver.jdbc=DEBUG
# Ver si Hibernate logra inicializarse tras conectar
# logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=DEBUG

# VARIABLE PARA PASAR A GENERAL
general.service.url=http://general-service:8082
