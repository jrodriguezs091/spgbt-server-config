# ==========================================================
# 1. CONFIGURACIÓN GLOBAL (Aplicada a todos los microservicios)
# ==========================================================

# A. Configuración de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.main.allow-bean-definition-overriding=true

# B. Configuración de la Base de Datos (Común a todos los que usan BD)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# C. Optimización del Pool (Ajustada para entorno de desarrollo/Telefónica)
# Reducimos de 30 a 10 para que el total de conexiones sea manejable
spring.datasource.hikari.maximum-pool-size=10

# Mínimo de conexiones que se mantienen vivas (evita que suba a 10 de golpe si no hay carga)
spring.datasource.hikari.minimum-idle=2

# Si una conexión no se usa en 20 seg, se cierra (ayuda a limpiar el 'sleeping')
spring.datasource.hikari.idle-timeout=20000

# Tiempo máximo de vida de una conexión (15 minutos es suficiente)
spring.datasource.hikari.max-lifetime=900000

# Tiempo de espera máximo para obtener una conexión del pool antes de dar error
spring.datasource.hikari.connection-timeout=30000

# Nombre descriptivo para el monitor de SQL Server
spring.datasource.hikari.pool-name=HikariPool-EVA

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs